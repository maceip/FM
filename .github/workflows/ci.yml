name: genesis-ci

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Architecture delta gate
        run: scripts/verify-architecture-delta.sh
      - name: Relocation safety gate
        run: scripts/verify-relocation-safety.sh
      - name: Large asset manifest
        run: scripts/download-models.sh --verify-only
      - name: Phase 1 LLM gate
        run: scripts/verify-llm-phase1.sh
      - name: Phase 6 release gates
        run: scripts/verify-phase6-release-gates.sh
      - name: Build
        run: ./gradlew clean assembleDebug assembleReleaseInternal testDebugUnitTest
      - name: Lint and static analysis
        run: ./gradlew detekt lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Dependency check
        run: ./gradlew dependencyCheckAnalyze

  emu-instrumentation:
    runs-on: ubuntu-latest
    needs: build-test-lint
    # Requires EMU_API_TOKEN repo secret (from emu-provision/.token for local parity)
    env:
      EMU_API_TOKEN: ${{ secrets.EMU_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Run on emu.devkeys.net (API 35 Pixel 5)
        run: |
          chmod +x scripts/emu-ci-run.sh
          ./scripts/emu-ci-run.sh \
            app/build/outputs/apk/debug/app-debug.apk \
            "com.google.research.air.cosmo/.ui.mainscreen.MainActivity" \
            90
      - name: Upload emu artifacts (logs + screen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-artifacts-${{ github.run_number }}
          path: artifacts/emu-run/
          retention-days: 14
