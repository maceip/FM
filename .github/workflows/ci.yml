name: fm-ci

# Lean PR gate: compile, lint, unit-test, static analysis, and minified release
# assembly. Recovered binary assets are gitignored and not distributed to the
# runner, so CI permits missing binaries while still checking manifest shape and
# build correctness. Local release gates remain strict by default.
#
# The emu validation gate described in PLAN.md runs against
# emu.devkeys.net via workflow_dispatch (manual trigger) below until
# CI binary distribution is in place. Local emu validation works today
# via scripts/emu-ci-run.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_emu:
        description: "Also run emu.devkeys.net validation (requires EMU_API_TOKEN secret)"
        type: boolean
        default: false
      emu_run_seconds:
        description: "How long to run on the emu (5–180)"
        type: string
        default: "90"

jobs:
  compile-lint-test:
    runs-on: ubuntu-latest
    env:
      COSMO_ALLOW_MISSING_BINARIES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Architecture-delta gate
        run: scripts/verify-architecture-delta.sh

      - name: Relocation safety gate
        run: scripts/verify-relocation-safety.sh

      - name: Model manifest (tolerant of missing binaries on CI)
        run: scripts/download-models.sh --verify-only --allow-missing-binaries

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Static analysis
        run: ./gradlew detekt lintDebug

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Release-internal APK
        run: ./gradlew :app:assembleReleaseInternal

  emu-validate:
    # Manual trigger only until CI binary distribution is solved.
    # Local devs run scripts/emu-ci-run.sh from their machine where the
    # recovered binaries are provisioned via scripts/provision-from-recovery.sh.
    runs-on: ubuntu-latest
    needs: compile-lint-test
    if: github.event_name == 'workflow_dispatch' && inputs.run_emu == true
    env:
      EMU_API_TOKEN: ${{ secrets.EMU_API_TOKEN }}
      COSMO_ALLOW_MISSING_BINARIES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Guard — EMU_API_TOKEN must be set as a repo secret
        run: |
          if [[ -z "${EMU_API_TOKEN:-}" ]]; then
            echo "::error::EMU_API_TOKEN secret is not configured."
            echo "Set it at https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Value lives at $COSMO_DEV_ROOT/emu-provision/.token on dev machines."
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Note about missing binaries
        run: |
          echo "::warning::CI runner does not have the recovered binaries (TFLites/SODA packs/.so files)."
          echo "::warning::The APK will install + launch but SODA / BERT / Conformer paths cannot execute."
          echo "::warning::This run validates: app boots, Hilt graph builds, ContextStore opens, ContextHub probe degrades gracefully."

      - name: Run on emu.devkeys.net
        run: |
          chmod +x scripts/emu-ci-run.sh
          ./scripts/emu-ci-run.sh --seconds "${{ inputs.emu_run_seconds }}"

      - name: Upload artifacts (logcat + screen.mp4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-${{ github.run_number }}
          path: artifacts/emu-run/
          retention-days: 14
