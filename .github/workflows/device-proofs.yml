name: device-proofs

# Manual device validation: gatekeeper golden, audio golden, inherent scorecard, release LLM.
# Requires a self-hosted runner with adb + attached Pixel, or run locally:
#   scripts/run-launch-device-proofs.sh

on:
  workflow_dispatch:
    inputs:
      skip_release_llm:
        description: "Skip releaseInternal LLM smoke (slow; needs LiteRT-LM on device)"
        type: boolean
        default: true
      skip_scorecard:
        description: "Skip inherent ambient scorecard harness"
        type: boolean
        default: false
      android_serial:
        description: "Optional ANDROID_SERIAL (e.g. 192.168.1.34:40239)"
        type: string
        default: ""

jobs:
  launch-device-proofs:
    runs-on: ubuntu-latest
    if: false # Enable when a self-hosted runner with adb is wired; use local scripts until then.
    env:
      COSMO_ALLOW_MISSING_BINARIES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Run launch device proofs
        env:
          ANDROID_SERIAL: ${{ inputs.android_serial }}
        run: |
          args=()
          if [[ "${{ inputs.skip_release_llm }}" == "true" ]]; then
            args+=(--skip-release-llm)
          fi
          if [[ "${{ inputs.skip_scorecard }}" == "true" ]]; then
            args+=(--skip-scorecard)
          fi
          scripts/run-launch-device-proofs.sh "${args[@]}"
