build:
  maxIssues: 0

complexity:
  CyclomaticComplexMethod:
    threshold: 20
  LongMethod:
    active: false
  TooManyFunctions:
    active: false
  LongParameterList:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  FunctionOnlyReturningConstant:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    max: 6
